name: Pruebas de Python

on:
  push:
    branches:
      - main
      - chore/organizar-por-semanas
  pull_request:
    branches:
      - main

jobs:
  pruebas-organizador:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias para las pruebas
        run: python -m pip install --upgrade pip pytest

      - name: Ejecutar pruebas del organizador
        run: python -m pytest semana03/test_organizador.py -v
